name: backend

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: backend-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg17
        env:
          POSTGRES_USER: momentum
          POSTGRES_PASSWORD: momentum
          POSTGRES_DB: momentum
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U momentum -d momentum"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Detect changes
        id: changes
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "push" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only HEAD^1 HEAD | grep -qE '^(backend/|\.github/workflows/backend\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        if: steps.changes.outputs.run == 'true'
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Sync
        if: steps.changes.outputs.run == 'true'
        working-directory: backend
        run: uv sync --locked

      - name: Ruff check
        if: steps.changes.outputs.run == 'true'
        working-directory: backend
        run: uv run ruff check .

      - name: Ruff format
        if: steps.changes.outputs.run == 'true'
        working-directory: backend
        run: uv run ruff format --check .

      - name: Pyright
        if: steps.changes.outputs.run == 'true'
        working-directory: backend
        run: uv run pyright

      - name: Pytest
        if: steps.changes.outputs.run == 'true'
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://momentum:momentum@localhost:5432/momentum
        run: uv run pytest
